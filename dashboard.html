<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 보드 — 모아보드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235b3df5'/><rect x='7' y='7' width='13' height='13' rx='3' fill='white'/><rect x='12' y='12' width='13' height='13' rx='3' fill='%23c6f432'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar-wrap">
    <div class="wrap topbar">
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true"></span>모아보드</a>
      <div class="topbar-actions">
        <span id="me" class="me"></span>
        <button id="logout" class="btn btn-sm">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="wrap dash">
    <form id="create-form" class="panel create">
      <h2>새 보드 만들기</h2>
      <label class="field"><span>보드 이름</span>
        <input class="input" name="title" maxlength="60" required placeholder="예: 오늘 수업 한 줄 소감">
      </label>
      <label class="field"><span>설명 <span class="hint">· 선택</span></span>
        <textarea class="input" name="description" maxlength="200" rows="3" placeholder="참여자에게 보일 안내 문구"></textarea>
      </label>
      <button id="create-btn" class="btn btn-primary btn-block">보드 만들기</button>
    </form>

    <section>
      <h1 class="page-title">내 보드 <span id="board-count" class="chip" hidden></span></h1>
      <div id="boards" class="board-list"></div>
      <div id="no-boards" class="empty" hidden>
        <svg viewBox="0 0 120 96" aria-hidden="true"><rect x="12" y="20" width="60" height="64" rx="12" fill="#d6e6ff" transform="rotate(-8 42 52)"/><g transform="rotate(6 76 44)"><rect x="46" y="12" width="60" height="64" rx="12" fill="#fff0b3" stroke="rgba(20,20,40,.1)"/><circle cx="62" cy="30" r="6" fill="#f2c230"/><rect x="58" y="44" width="36" height="6" rx="3" fill="rgba(20,20,40,.16)"/><rect x="58" y="56" width="24" height="6" rx="3" fill="rgba(20,20,40,.1)"/></g></svg>
        <strong>아직 보드가 없습니다</strong>
        <span>새 보드 만들기 칸에서 첫 보드를 만들어 보세요.</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const list = document.getElementById("boards");
    const noBoards = document.getElementById("no-boards");
    const form = document.getElementById("create-form");
    const createBtn = document.getElementById("create-btn");
    const colorKeys = Object.keys(CARD_COLORS);

    function renderBoard(board, atTop) {
      const cardCount = board.cards?.[0]?.count ?? 0;
      const color = colorKeys[list.querySelectorAll(".board-item").length % colorKeys.length];
      const item = el("article", "board-item c-" + color);
      item.append(el("div", "board-badge"), el("h3", null, board.title));
      if (board.description) item.append(el("p", null, board.description));
      item.append(el("span", "board-meta", "카드 " + cardCount + "장 · " + timeAgo(board.created_at) + " 만듦"));

      const row = el("div", "row");
      const open = el("a", "btn btn-sm btn-primary", "열기");
      open.href = "board.html?id=" + board.id;
      const copy = el("button", "btn btn-sm", "링크 복사");
      copy.addEventListener("click", () => copyText(boardLink(board.id)));
      row.append(open, copy);
      item.append(row);

      atTop ? list.prepend(item) : list.append(item);
      noBoards.hidden = true;
      updateCount();
    }

    function updateCount() {
      const count = list.querySelectorAll(".board-item").length;
      const badge = document.getElementById("board-count");
      badge.textContent = count + "개";
      badge.hidden = count === 0;
    }

    async function init() {
      if (!db) {
        form.querySelectorAll("input, textarea, button").forEach(x => x.disabled = true);
        noBoards.hidden = false;
        return;
      }
      const user = await currentUser();
      if (!user) return location.replace("login.html");
      document.getElementById("me").textContent = user.email;
      list.replaceChildren(el("div", "skeleton"), el("div", "skeleton"), el("div", "skeleton"));

      // RLS는 모든 보드를 보여 주므로, 내 보드만 owner로 거른다
      const { data, error } = await db.from("boards")
        .select("id, title, description, created_at, cards(count)")
        .eq("owner", user.id)
        .order("created_at", { ascending: false });
      list.replaceChildren();
      if (error) return toast("보드를 불러오지 못했습니다: " + error.message);
      data.forEach(b => renderBoard(b, false));
      noBoards.hidden = data.length > 0;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fields = new FormData(form);
      const title = fields.get("title").trim();
      const description = fields.get("description").trim() || null;
      if (!title) return toast("보드 이름을 적어 주세요");

      createBtn.disabled = true;
      const { data, error } = await db.from("boards").insert({ title, description }).select().single();
      createBtn.disabled = false;
      if (error) return toast("만들지 못했습니다: " + error.message);

      renderBoard(data, true);
      form.reset();
      toast("보드를 만들었습니다. 링크를 복사해 나눠 주세요");
    });

    document.getElementById("logout").addEventListener("click", async () => {
      if (db) await db.auth.signOut();
      location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
